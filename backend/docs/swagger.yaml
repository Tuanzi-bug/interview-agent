basePath: /api/v1
definitions:
  service.CreateInterviewRequest:
    properties:
      difficulty:
        enum:
        - easy
        - medium
        - hard
        type: string
      job_title:
        type: string
      resume_id:
        type: integer
      type:
        enum:
        - comprehensive
        - specialized
        - resume-based
        type: string
    required:
    - difficulty
    - job_title
    - type
    type: object
  service.CreateResumeRequest:
    properties:
      content:
        type: string
      name:
        type: string
    required:
    - content
    - name
    type: object
  service.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  service.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  service.SubmitAnswerRequest:
    properties:
      answer:
        type: string
      question_id:
        type: integer
    required:
    - answer
    - question_id
    type: object
host: localhost:8000
info:
  contact:
    email: support@example.com
    name: 技术支持
    url: http://example.com/support
  description: 智能面试助手系统，提供用户管理、简历管理、面试管理等功能
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-Eino 智能面试系统 API文档
  version: 1.0.0
paths:
  /api/v1/interview:
    get:
      description: 获取当前用户的所有面试记录
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户面试列表
      tags:
      - 面试管理
    post:
      consumes:
      - application/json
      description: 根据用户选择的岗位和简历创建新的面试
      parameters:
      - description: 创建面试请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateInterviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误或创建失败
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 创建面试
      tags:
      - 面试管理
  /api/v1/interview/{id}:
    get:
      description: 根据面试ID获取面试详细信息
      parameters:
      - description: 面试ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的面试ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 面试不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取面试详情
      tags:
      - 面试管理
  /api/v1/interview/{id}/answer:
    post:
      consumes:
      - application/json
      description: 提交面试问题的回答
      parameters:
      - description: 面试ID
        in: path
        name: id
        required: true
        type: integer
      - description: 提交回答请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.SubmitAnswerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 提交成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的面试ID或请求参数错误
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 提交回答
      tags:
      - 面试管理
  /api/v1/interview/{id}/end:
    post:
      description: 结束指定ID的面试，生成面试结果
      parameters:
      - description: 面试ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 结束成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的面试ID或结束失败
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 结束面试
      tags:
      - 面试管理
  /api/v1/interview/{id}/questions:
    get:
      description: 获取指定面试ID的所有问题和回答
      parameters:
      - description: 面试ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的面试ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取面试问题列表
      tags:
      - 面试管理
  /api/v1/interview/{id}/result:
    get:
      description: 获取指定ID面试的评价结果
      parameters:
      - description: 面试ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的面试ID或面试未完成
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 面试不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取面试结果
      tags:
      - 面试管理
  /api/v1/interview/{id}/start:
    post:
      description: 开始指定ID的面试，生成面试问题
      parameters:
      - description: 面试ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 开始成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的面试ID或开始失败
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 面试不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 开始面试
      tags:
      - 面试管理
  /api/v1/resume:
    get:
      description: 获取当前登录用户的所有简历
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 获取失败
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户简历列表
      tags:
      - 简历管理
    post:
      consumes:
      - application/json
      description: 为当前登录用户创建一个新的简历
      parameters:
      - description: 创建简历请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateResumeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 创建失败
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 创建简历
      tags:
      - 简历管理
  /api/v1/resume/{id}:
    delete:
      description: 删除指定ID的简历
      parameters:
      - description: 简历ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的简历ID或删除失败
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 删除简历
      tags:
      - 简历管理
    get:
      description: 根据简历ID获取指定简历的详细信息
      parameters:
      - description: 简历ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的简历ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 简历不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取简历详情
      tags:
      - 简历管理
    put:
      consumes:
      - application/json
      description: 更新指定ID的简历信息
      parameters:
      - description: 简历ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新简历请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateResumeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 简历不存在
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 更新失败
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 更新简历
      tags:
      - 简历管理
  /api/v1/resume/{id}/analyze:
    post:
      description: 使用AI分析指定ID的简历内容
      parameters:
      - description: 简历ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 分析成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的简历ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 分析失败
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 分析简历
      tags:
      - 简历管理
  /api/v1/user/login:
    post:
      consumes:
      - application/json
      description: 用户通过邮箱和密码进行登录
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 认证失败
          schema:
            additionalProperties: true
            type: object
      summary: 用户登录
      tags:
      - 用户管理
  /api/v1/user/profile:
    get:
      description: 获取当前登录用户的详细资料
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 用户不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户资料
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 更新当前登录用户的资料信息
      parameters:
      - description: 更新请求参数
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权访问
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 更新失败
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 更新用户资料
      tags:
      - 用户管理
  /api/v1/user/register:
    post:
      consumes:
      - application/json
      description: 用户通过邮箱和密码进行注册
      parameters:
      - description: 注册请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      summary: 用户注册
      tags:
      - 用户管理
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
